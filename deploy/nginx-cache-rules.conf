# Cache rules for the index files, for the data server's nginx. Include this file at the SERVER level, not inside
# the /collections/ location: nginx doesn't allow location blocks inside a location. These blocks need the same
# root (or alias) as your /collections/ location, or they won't find the files.
#
# Two rules:
#  - content-named files (name.<ten hex digits>.json or .lps) never change, so browsers and Cloudflare keep them
#    for a year. A rebuild gives a changed file a new name, so nothing stale is ever served.
#  - manifest.json is the one file that changes. It is always checked (a small "not changed" answer when it hasn't).
#
# Each block repeats the CORS header: an add_header in a location replaces the ones from the parent, so a block
# without it would stop sending it.

location ~ "\.[0-9a-f]{10}\.(json|lps)$" {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /collections/find-sign/raw/index/manifest.json {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}
