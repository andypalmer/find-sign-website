# Settings for the plain nginx that serves the find sign collections (the data server).
# Put these inside the `location` (or `server`) that serves /collections/, or `include` this file there.
# deploy/README.md explains why each one is here, and what is deliberately left out.

# Let any website read the collections from a browser. The data is public and read-only, and no cookies are sent,
# so a wildcard is safe. Without it a site on another origin (beta, beta2, a visitor's own page) is refused, and
# so is a service worker fetching the files. `always` keeps the header on error answers too (404s, 304s).
# Don't list origins here: a shared cache such as Cloudflare would keep one site's answer and hand it to everyone.
add_header Access-Control-Allow-Origin "*" always;

# Squash the index files on the way out. The JSON ones (columns, shards, meta) shrink to a sixth or much
# less, so a visitor's first search drops from about 5.8 MB to about 3.3 MB.
gzip on;
gzip_types application/json;
gzip_comp_level 5;      # a good squash without hogging the processor
gzip_min_length 256;    # smaller than this isn't worth it
gzip_proxied any;       # also when a proxy (Cloudflare, Traefik) is between nginx and the visitor
gzip_vary on;           # tell caches the answer depends on the visitor's Accept-Encoding

# Not listed on purpose: application/octet-stream, which is what the .lps word vector files are sent as. They
# are lists of decimal numbers that barely shrink (global-vectors.lps: 3.28 MB to 3.03 MB), so squashing them
# only costs processor time.

# Cache-Control is not set here, because it depends on the file's name. Content-named files (version 2) get a year,
# and manifest.json is always checked: see nginx-cache-rules.conf, which goes at the server level. Version 1 files keep
# the same names from one build to the next, so they get no long cache.
