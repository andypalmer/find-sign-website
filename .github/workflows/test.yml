# Installs, builds, type-checks and tests every workspace. Called by node.js.yml and release-please.yml.

name: Test

on:
  workflow_call:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run check
    - run: npm test
