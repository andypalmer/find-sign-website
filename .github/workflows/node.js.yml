# Tests every workspace, then on pushes to main or production, or of a version tag pushed by hand (v1.2.3),
# publishes the apps' container images. Releases made by release-please publish their own images
# (release-please.yml), since tags it creates don't trigger workflows.

name: Node.js CI

on:
  push:
    branches: [ "main", "production" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    uses: ./.github/workflows/test.yml

  images:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
