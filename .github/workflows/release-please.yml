# Keeps a release PR open on main, with the next version (from Conventional Commit messages) and the
# changelog. Merging it tags the release (v1.2.3) and creates a GitHub release; this workflow then tests that
# commit and publishes versioned images. Config: release-please-config.json, .release-please-manifest.json

name: Release Please

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app_released: ${{ steps.release.outputs.release_created }}
      app_version: ${{ steps.release.outputs.version }}
    steps:
    - id: release
      uses: googleapis/release-please-action@v4

  test:
    needs: release-please
    if: needs.release-please.outputs.app_released == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml

  images:
    needs: [release-please, test]
    if: needs.release-please.outputs.app_released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.app_version }}
